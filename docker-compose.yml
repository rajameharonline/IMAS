# IMAS — Coolify-এ সরাসরি import করার জন্য full Docker Compose স্ট্যাক।
#
# আগের ভার্সন (Phase-1, isp_bnas থেকে কপি করা) MySQL/Redis/FreeRADIUS host-এ native
# রেখে শুধু django-app/celery/nginx কন্টেইনারাইজ করত (host.docker.internal দিয়ে
# কানেক্ট)। কিন্তু app কোড ইতিমধ্যে PostgreSQL-এ কনভার্ট হয়ে গেছে (settings.py,
# requirements.txt) এবং এই প্রজেক্ট MySQL-native isp_bnas-এর মতো কোনো বিদ্যমান
# host সার্ভিসের উপর নির্ভর করে না — তাই এখানে db/redis-ও পুরোপুরি containerize করা
# হলো (PRD_POSTGRES_REBUILD.md §21 অনুযায়ী), যাতে পুরো স্ট্যাক এক কমান্ডে
# (docker compose up) fresh git clone থেকেই দাঁড়িয়ে যায় — কোনো host-side
# MySQL/Redis bind-address/GRANT সেটআপ (docker/setup_host_networking.sh) লাগে না।
#
# FreeRADIUS ব্যতিক্রম: raw UDP (1812/1813/3799) + NAS client-IP নির্ভর বলে
# network_mode: host বাধ্যতামূলক (§21.2/§21.4)। host network-এ থাকায় সে `db`
# hostname দিয়ে bridge network resolve করতে পারে না — তাই db-র 5432 পোর্ট
# শুধু 127.0.0.1-এ (host loopback, বাইরে exposed নয়) publish করা হয়েছে এবং
# freeradius কন্টেইনারে RADIUS_DB_HOST=127.0.0.1 override করা আছে।
# (একই host-এ অন্য Coolify resource আগে থেকে 5432 ব্যবহার করলে conflict হবে —
# সেক্ষেত্রে এই publish port বদলে দিন এবং freeradius-এর RADIUS_DB_PORT-ও মেলান)
#
# Asterisk/VoIP (coturn সহ) এবং LiveTV (Intel QSV GPU) ইচ্ছাকৃতভাবে এই কম্পোজে
# নেই — PRD §21.7 সিদ্ধান্ত ম্যাট্রিক্স অনুযায়ী প্রথম রিলিজে এগুলো host-এ নেটিভ
# রাখাই নিরাপদ (RTP/NAT ও GPU passthrough জটিলতার কারণে), পরে ধাপে ধাপে আনা যায়।
# deploy/asterisk/ এখনো আগের মতোই host-এ install.sh দিয়ে সেটআপ হবে।
#
# ব্যবহার (Coolify import বা ম্যানুয়াল):
#   cp .env.example .env   # তারপর মান পূরণ করুন (DB_PASSWORD, SECRET_KEY, ইত্যাদি) —
#                          # এই একই .env docker compose নিজের ${VAR} interpolation-এর
#                          # জন্যও পড়ে (db/nginx সার্ভিস), তাই আলাদা .env.docker লাগে না।
#   docker compose build
#   docker compose up -d db redis
#   docker compose run --rm django-app python manage.py migrate
#   docker compose run --rm django-app python manage.py collectstatic --noinput
#   docker compose run --rm django-app python manage.py createsuperuser
#   docker compose up -d
#   docker compose logs -f freeradius   # schema প্রথমবার লোড হচ্ছে কিনা দেখুন

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # শুধু host loopback-এ — freeradius (network_mode: host) এখান দিয়েই db-তে
      # পৌঁছায় (bridge network hostname `db` host-network কন্টেইনার থেকে resolve
      # হয় না)। বাইরের ইন্টারনেট থেকে অ্যাক্সেসযোগ্য নয়।
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # শুধু compose-internal bridge network-এ থাকে (কোনো ports: publish নেই),
    # তাই host/বাইরে থেকে reachable নয় — requirepass এখানে বাধ্যতামূলক নয়।

  django-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: imas-app:latest
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      RADIUS_DB_HOST: db
      RADIUS_DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: django-db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./media:/var/www/IMAS/media
      - ./staticfiles:/var/www/IMAS/staticfiles
      - ./logs:/var/www/IMAS/logs
    ports:
      - "8001:8000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: imas-app:latest
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      RADIUS_DB_HOST: db
      RADIUS_DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: django-db
    volumes:
      - ./media:/var/www/IMAS/media
      - ./logs:/var/www/IMAS/logs
    entrypoint: ["entrypoint.sh"]
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 10G

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: imas-app:latest
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      RADIUS_DB_HOST: db
      RADIUS_DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: django-db
    volumes:
      - ./media:/var/www/IMAS/media
      - ./logs:/var/www/IMAS/logs
    entrypoint: ["entrypoint.sh"]
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  nginx:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: imas-frontend:latest
    volumes:
      - ./staticfiles:/var/www/IMAS/staticfiles:ro
      - ./media:/var/www/IMAS/media:ro
    ports:
      - "8081:80"     # admin_panel + /api/ + /admin/
      - "8091:8080"   # user_portal + /api/
    depends_on:
      - django-app
    restart: unless-stopped

  freeradius:
    build:
      context: ./docker/freeradius
    image: imas-freeradius:latest
    network_mode: host
    env_file:
      - .env
    environment:
      # host network-এ থাকায় `db` service-name resolve হয় না — db-র host-published
      # loopback পোর্ট (উপরে দেখুন) ব্যবহার করা হচ্ছে
      RADIUS_DB_HOST: 127.0.0.1
      RADIUS_DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
