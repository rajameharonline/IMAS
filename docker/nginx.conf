# Docker কন্টেইনার nginx config — nginx_config/isp_bnas.conf-এর সমতুল্য,
# শুধু upstream django_api কন্টেইনার সার্ভিস নাম (django-app:8000) ব্যবহার করে।
# admin_panel/user_portal dist/ এখন docker/frontend.Dockerfile multi-stage build-এ
# image-এর ভেতরেই bake করা (COPY --from), media/static shared volume থেকে আসে।

upstream django_api {
    server django-app:8000;
}

server {
    listen 80;
    server_name localhost;

    location / {
        root /var/www/IMAS/admin_panel/dist;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10M;
    }

    location /admin/ {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
    }

    location /media/ {
        alias /var/www/IMAS/media/;
    }

    location /static/ {
        alias /var/www/IMAS/staticfiles/;
    }
}

server {
    listen 8080;
    server_name localhost;

    location / {
        root /var/www/IMAS/user_portal/dist;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
