sonar.projectKey=rajameharonline1-afk_isp_bnas
sonar.organization=rajameharonline1-afk


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=isp_bnas
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Free org plan-এর 50,000 LOC limit-এর কারণে frontend (JS/React/Expo) বাদ দেওয়া হয়েছে,
# শুধু Django backend (Python) scan হচ্ছে — paid plan-এ upgrade হলে এই exclusion সরানো যাবে।
# গুরুত্বপূর্ণ: আগের exclusion frontend source dir গুলো ধরত না (admin_panel/mobile_app/
# livetv_app), তাই ~74k JS LOC scan হয়ে 50k limit ছাড়িয়ে analysis fail করত।
# এখন frontend dir + JS/TS/CSS file-type দুই ভাবেই বাদ (belt-and-suspenders)।
# Django auto-generated migrations-ও বাদ — এগুলো generated code, hand-edit করা উচিত নয়
# আর এদের duplicate-literal/unused-var smell গুলো noise মাত্র।
sonar.exclusions=**/node_modules/**, **/venv/**, **/env/**, **/build/**, **/dist/**, **/static/**, **/staticfiles/**, **/media/**, **/migrations/**, admin_panel/**, mobile_app/**, livetv_app/**, user_portal/**, **/*.js, **/*.jsx, **/*.ts, **/*.tsx, **/*.css, **/*.scss, **/*.less, **/*.min.js, **/*.md, **/*.txt, **/*.ps1, **/*.cmd, **/*.exe, **/*.dll, **/*.so, **/*.dylib

sonar.python.version=3.14
sonar.sourceEncoding=UTF-8

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8