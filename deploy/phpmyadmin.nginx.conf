# phpMyAdmin — nginx location block
# ──────────────────────────────────────────────────────────────
# কোথায় বসাবে: /etc/nginx/sites-available/isp_bnas এর HTTPS server
# block-এর ভেতরে (server_name roisp.duckdns.org; listen 443 ...),
# `location ~ /\.(?!well-known) { deny all; }` লাইনের ঠিক আগে।
#
# কেন: phpMyAdmin /var/www/html/phpmyadmin-এ আছে কিন্তু nginx config-এ
# কোনো route/PHP handling ছিল না — তাই /phpmyadmin React app fallback-এ
# পড়ে যেত। এই block /phpmyadmin/*.php কে PHP 8.5-FPM-এ পাঠায়।
#
# ⚠️ নিরাপত্তা: phpMyAdmin public internet-এ খোলা রাখা ঝুঁকিপূর্ণ।
#    নিচের `allow/deny` দিয়ে শুধু LAN + localhost-এ সীমাবদ্ধ রাখা হয়েছে।
#    বাইরে থেকে দরকার হলে VPN/SSH tunnel ব্যবহার করুন, public খুলবেন না।
# ──────────────────────────────────────────────────────────────

location /phpmyadmin {
    # শুধু LAN ও localhost — public access বন্ধ (নিরাপত্তা)
    allow 127.0.0.1;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    deny all;

    root /var/www/html;
    index index.php index.html;

    # /phpmyadmin → /phpmyadmin/ redirect
    location = /phpmyadmin { return 301 /phpmyadmin/; }

    # .php ফাইল → PHP 8.5-FPM socket
    location ~ ^/phpmyadmin/(.+\.php)$ {
        root /var/www/html;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # static asset (css/js/img ইত্যাদি)
    location ~* ^/phpmyadmin/(.+\.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|html|xml|txt|map))$ {
        root /var/www/html;
        expires 7d;
    }

    # সংবেদনশীল ডিরেক্টরি ব্লক
    location ~ ^/phpmyadmin/(?:libraries|templates|setup/lib)/ { deny all; }
}
