; ════════════════════════════════════════════════════════════════════════════
; RTP media পোর্ট রেঞ্জ + ICE (WebRTC NAT traversal)।
; এই রেঞ্জ firewall-এ UDP খুলতে হবে (install.sh মনে করিয়ে দেয়)।
; ════════════════════════════════════════════════════════════════════════════

[general]
rtpstart=10000
rtpend=20000
icesupport=yes
; STUN — coturn কেই STUN হিসেবেও ব্যবহার করা যায়:
;stunaddr=@@PUBLIC_IP@@:3478
