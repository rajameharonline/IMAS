; ════════════════════════════════════════════════════════════════════════════
; Asterisk built-in HTTP server।
;   - 127.0.0.1:8088 (plain)  → শুধু ARI (localhost-only, বাইরে expose নয়)
;   - 0.0.0.0:8089 (TLS/WSS)  → WebRTC signaling (browser ও mobile app)
; ════════════════════════════════════════════════════════════════════════════

[general]
enabled=yes
bindaddr=127.0.0.1
bindport=8088

; WSS (WebRTC) — Let's Encrypt cert (install.sh কপি করে /etc/asterisk/keys-এ)
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/fullchain.pem
tlsprivatekey=/etc/asterisk/keys/privkey.pem
