; ════════════════════════════════════════════════════════════════════════════
; AMI (Asterisk Manager Interface) — Django file-based provisioning-এ
; `pjsip reload` ট্রিগার করতে। ⚠️ শুধু 127.0.0.1 (localhost-only, বাইরে expose নয়)।
; ব্যবহারকারী ও secret install.sh generate করে এখানে বসায় + .env-এ লেখে।
; ════════════════════════════════════════════════════════════════════════════

[general]
enabled = yes
port = 5038
bindaddr = 127.0.0.1

[@@AMI_USER@@]
secret = @@AMI_PASS@@
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
; read-এ 'call' আবশ্যক — voip_call_listener এই class-এর Dial/Hangup event পড়ে।
read = system,call,command,reporting,dialplan
; write-এ 'originate,call' আবশ্যক — Voice SMS (automated voice call) Originate action।
write = system,command,reporting,originate,call
