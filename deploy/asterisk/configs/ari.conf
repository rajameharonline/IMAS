; ════════════════════════════════════════════════════════════════════════════
; ARI (Asterisk REST Interface) — Django এর জন্য call control + event।
; ⚠️ http.conf-এ ARI শুধু 127.0.0.1:8088-এ — তাই বাইরে থেকে অ্যাক্সেস করা যায় না।
; ব্যবহারকারী ও পাসওয়ার্ড install.sh generate করে এখানে বসায় + .env-এ লেখে।
; ════════════════════════════════════════════════════════════════════════════

[general]
enabled=yes
pretty=yes
allowed_origins=*

[@@ARI_USER@@]
type=user
read_only=no
password=@@ARI_PASS@@
