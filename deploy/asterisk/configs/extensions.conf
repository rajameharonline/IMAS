; ════════════════════════════════════════════════════════════════════════════
; Dialplan — app-to-app কলিং।
; endpoint context = 'voip-internal' (provisioning service এটাই সেট করে)।
;   client_<id> / agent_<id> ডায়াল → ঐ PJSIP endpoint বাজে।
; Phase 3-এ AMI listener এই কলগুলো ধরে call log লেখে।
; ════════════════════════════════════════════════════════════════════════════

[voip-internal]
; _[a-z]. = এক lowercase letter + এক-বা-একাধিক যেকোনো char।
;   client_4, agent_1 — সব ম্যাচ করে। ('.' সবচেয়ে নির্ভরযোগ্য; '!' literal-prefix-এ
;   কিছু Asterisk build-এ ম্যাচ করে না — তাই '.' ব্যবহার।)
;   single-char special exten (h/i/t/s) ম্যাচ করে না (≥2 char লাগে), তাই নিরাপদ।
; ── Stage 2: FCM-wake + retry ────────────────────────────────────────────────
; কল flow:
;   CallOriginateView (API) → FCM push পাঠায় → client app জাগে → SIP register করে
;   → ARI Originate (agent softphone বাজে) → agent answer → dialplan চলে
;   → Dial(PJSIP/client_N) retry loop → client registered হলেই connect।
;
; কেন retry: agent answer করতে ৩-৫s লাগে + app register করতে ৫-২০s লাগে।
; মোট window = ~৬০s (mobile data-এ app wake + NAT traverse সহ পর্যাপ্ত)।
;
; NOTE: staff extension (101/102/103...) → agent direct dial আলাদাভাবে
; pbx_provision._write_all_hotlines() generate করে (PBX Agents পেজ থেকে; hotline.conf-এ)।
; তাই এখানে আলাদা numeric rule লাগে না।
exten => _[a-z].,1,NoOp(VoIP call → ${EXTEN} from ${CALLERID(num)})
 same => n,Ringing()                                ; agent-কে ringback (client খোঁজার সময়)
 same => n,Set(TRIES=0)
 same => n(retry),Dial(PJSIP/${EXTEN},15,tT)
 same => n,NoOp(try=${TRIES} DialStatus=${DIALSTATUS})
 ; client registered ও connected → ANSWER/NOANSWER/BUSY/CANCEL → কল শেষ
 same => n,ExecIf($["${DIALSTATUS}"!="CHANUNAVAIL"]?Hangup())
 ; এখনো unavailable (app registering) → ১s পর retry
 same => n,Set(TRIES=$[${TRIES}+1])
 same => n,ExecIf($[${TRIES}>60]?Hangup())   ; ~৬০s window (mobile data-এও যথেষ্ট)
 same => n,Wait(1)
 same => n,Goto(retry)

; ════════════════════════════════════════════════════════════════════════════
; [voip-announce] — Voice SMS (automated voice call broadcast)।
; backend AMI Originate করে: Channel=PJSIP/client_X, Context=voip-announce,
; Exten=s, Variable ANNOUNCE=<absolute wav path (ext ছাড়া)>। client রিসিভ করলে
; রেকর্ড করা অডিও বাজে, তারপর hangup। (one-way announcement — bridge নেই।)
; ════════════════════════════════════════════════════════════════════════════
[voip-announce]
exten => s,1,NoOp(Voice announce → ${ANNOUNCE})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(${ANNOUNCE})
 same => n,Wait(1)
 same => n,Hangup()

; ARI-controlled কল (Phase 3) — দরকার হলে:
;exten => _[a-z].,1,Stasis(isp-voip)
; same => n,Hangup()

; ════════════════════════════════════════════════════════════════════════════
; IP-PBX / Hotline ডায়ালপ্ল্যান — Django admin থেকে তৈরি ও পরিচালিত।
; voip/services/pbx_provision.py লেখে; Admin → VoIP → Hotline Control থেকে apply করুন।
; প্রথম সেটআপে একবার চালান:
;   sudo install -d -o isp -g asterisk -m 2775 /etc/asterisk/extensions_isp.d
;   sudo chown asterisk:asterisk /etc/asterisk/extensions.conf (reload-এর পর)
; ════════════════════════════════════════════════════════════════════════════
#include "extensions_isp.d/hotline.conf"
