; ════════════════════════════════════════════════════════════════════════════
; PJSIP — TRANSPORT static এখানে; প্রতিটি client/agent endpoint আলাদা file-এ
; (pjsip_isp.d/*.conf), Django provisioning service যা লেখে ও `pjsip reload` করে।
; (realtime/ODBC ব্যবহার করা হয়নি — mysql-server ⨯ mariadb-common conflict; README দেখুন)।
; WebRTC client (SIP.js, mobile) WSS দিয়ে connect করে। TLS/পোর্ট http.conf-এ।
; বিস্তারিত: VOIP_PLAN.md, deploy/asterisk/README.md
; ════════════════════════════════════════════════════════════════════════════

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0
; WSS-এর আসল TLS listener http.conf-এ (tlsbindaddr 0.0.0.0:8089)।
; Asterisk যদি NAT-এর পেছনে থাকে (private IP), নিচের দুটি uncomment করে পাবলিক IP দিন:
;external_media_address=@@PUBLIC_IP@@
;external_signaling_address=@@PUBLIC_IP@@

; ── ISP auto-provisioned endpoints (Django লেখে; হাতে এডিট নয়) ──
#include "pjsip_isp.d/*.conf"
