# ════════════════════════════════════════════════════════════════════════════
# coturn — WebRTC NAT traversal (TURN/STUN)।
# use-auth-secret: Django ephemeral (time-limited HMAC) credential দেয় — static
# long-term user নয়, frontend-এ secret কখনো যায় না (TURN abuse রোধ)।
# secret install.sh generate করে এখানে + .env (TURN_SECRET)-এ বসায়।
# ════════════════════════════════════════════════════════════════════════════

listening-port=3478
tls-listening-port=5349

# Relay media পোর্ট রেঞ্জ (firewall-এ UDP খুলতে হবে)
min-port=49152
max-port=65535

fingerprint
use-auth-secret
static-auth-secret=@@TURN_SECRET@@
realm=@@DOMAIN@@

# TLS (Let's Encrypt — Asterisk-এর একই cert)
cert=/etc/asterisk/keys/fullchain.pem
pkey=/etc/asterisk/keys/privkey.pem

# নিরাপত্তা — private/loopback relay বন্ধ
no-loopback-peers
no-multicast-peers
no-cli
no-tcp-relay

# Asterisk NAT-এর পেছনে থাকলে পাবলিক IP নির্দিষ্ট করুন:
#external-ip=@@PUBLIC_IP@@

log-file=/var/log/turnserver/turn.log
