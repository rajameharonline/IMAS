# ক্লায়েন্ট অ্যাপ APK direct-download — nginx server block-এর ভেতরে এই দুটি location
# যোগ করুন (আপনার মূল ডোমেইনের server {} ব্লকে)। ক্লিক করলেই download শুরু হয়।
#
# ফাইল: /var/www/isp_bnas/mobile_app/public_apk/rajamehar-online.apk
# সংক্ষিপ্ত লিংক: https://<domain>/app   (আর /download/ দিয়ে যেকোনো APK)

# সংক্ষিপ্ত সরাসরি-download লিংক → https://<domain>/app
location = /app {
    alias /var/www/isp_bnas/mobile_app/public_apk/rajamehar-online.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="rajamehar-online.apk"';
    add_header Cache-Control 'no-cache';
}

# পুরো download ডিরেক্টরি (একাধিক/ভবিষ্যৎ version) → https://<domain>/download/<file>.apk
location /download/ {
    alias /var/www/isp_bnas/mobile_app/public_apk/;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment';
    add_header Cache-Control 'no-cache';
    autoindex off;
}
