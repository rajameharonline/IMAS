# Walled Garden — App APK download serving
# ──────────────────────────────────────────────────────────────
# expired client "অ্যাপ ডাউনলোড" বাটনে চাপলে /app/download → এই location
# APK serve করে। portal whitelisted বলে walled garden-এও download কাজ করে।
#
# ⚠️ গুরুত্বপূর্ণ: এই location-টা walled garden default_server block-এর ভেতরে,
#    `location / { rewrite ^.*$ /expired/ ... }` (catch-all)-এর **আগে** বসাতে
#    হবে — নাহলে catch-all এটাকেও /expired/-এ পাঠিয়ে দেবে।
#    চাইলে main HTTPS server (roisp.duckdns.org) block-এও একই location রাখুন,
#    যাতে non-expired user-ও download করতে পারে।
#
# APK ফাইল রাখার জায়গা: /var/www/isp_bnas/mobile_app/public_apk/rajamehar-online.apk
#   (EAS build করে এই নামে এখানে রাখুন; নতুন version দিলে শুধু একই নামে ফাইল replace —
#    nginx config বদলাতে হবে না। ফাইল world-readable হতে হবে: chmod 644)
# ──────────────────────────────────────────────────────────────

location = /app/download {
    alias /var/www/isp_bnas/mobile_app/public_apk/rajamehar-online.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename=rajamehar-online.apk';
    add_header Cache-Control 'no-cache';
}
