# ISP Billing & Network Automation System - Nginx Configuration
# এই ফাইলটি /etc/nginx/sites-available/isp_bnas-তে কপি করুন এবং symlink দিন:
# sudo cp nginx_config/isp_bnas.conf /etc/nginx/sites-available/isp_bnas
# sudo ln -s /etc/nginx/sites-available/isp_bnas /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

upstream django_api {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name localhost admin.yourisp.com;

    location / {
        root /home/amir/Desktop/isp_bnas/admin_panel/dist;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10M;
    }

    location /admin/ {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
    }

    location /media/ {
        alias /home/amir/Desktop/isp_bnas/media/;
    }

    location /static/ {
        alias /home/amir/Desktop/isp_bnas/staticfiles/;
    }
}

server {
    listen 8080;
    server_name localhost portal.yourisp.com;

    location / {
        root /home/amir/Desktop/isp_bnas/user_portal/dist;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://django_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
